name: algotrading-box
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: algotrading-box
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run the box
        run: python3 box.py
      - name: commit state
        run: |
          git config user.name "algotrading-box"
          git config user.email "box@algotrading-box.local"
          git add -A
          git diff --cached --quiet || git commit -m "box run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
